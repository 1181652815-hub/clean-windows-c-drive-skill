name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish single-file EXE
        shell: pwsh
        run: >-
          dotnet publish app/CDriveManager/CDriveManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/win-x64
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:ContinuousIntegrationBuild=true

      - name: Smoke test
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'c-drive-manager-smoke.json'
          $process = Start-Process -FilePath '.\artifacts\win-x64\CDriveManager.exe' -ArgumentList @('--smoke-test', $result) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Smoke test process failed: $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $result -PathType Leaf)) { throw 'Smoke test did not produce a result file.' }
          $data = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          if ($data.Status -ne 'PASS') { throw "Smoke test failed: $($data.Error)" }
          if ($data.ResultTableBindings -ne 'PASS') { throw 'Large-file or duplicate-file table binding failed.' }
          $payload = Join-Path $env:RUNNER_TEMP 'c-drive-manager-health.json'
          '{"Action":"Health"}' | Set-Content -LiteralPath $payload -Encoding ascii
          $bridge = Join-Path $data.Runtime 'scripts\Invoke-DesktopBridge.ps1'
          $healthRaw = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $bridge -PayloadPath $payload
          if ($LASTEXITCODE -ne 0) { throw "Health bridge failed: $LASTEXITCODE" }
          $health = $healthRaw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($health.Overall)) { throw 'Health bridge returned no overall state.' }
          "Health bridge: $($health.Overall), coverage: $($health.Coverage)"
          Get-FileHash -LiteralPath '.\artifacts\win-x64\CDriveManager.exe' -Algorithm SHA256 | Format-List

      - name: Package release
        shell: pwsh
        run: |
          Copy-Item -LiteralPath README.md -Destination artifacts/win-x64/README.md
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/CDriveManager-v3.0.1-win-x64.zip
          Get-FileHash -LiteralPath artifacts/win-x64/CDriveManager.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  CDriveManager.exe" } |
            Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDriveManager-v3.0.1-win-x64
          path: |
            artifacts/win-x64/CDriveManager.exe
            artifacts/CDriveManager-v3.0.1-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
